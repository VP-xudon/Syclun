# ============================================================
# release.yml — build & publish the five Synth-OOP distributions
# release.yml —— 构建并发布五个 Synth-OOP 分发包
#
# This is the CI path that actually produces ALL five packages from one
# trigger, because a single host can only build the targets matching its
# own OS/architecture. Each matrix leg runs `package.sh` on the runner that
# can build that target; the aggregated `release` job then publishes them as
# GitHub release assets on a tag push (or manually via workflow_dispatch).
#
# 单一宿主只能构建与其自身 OS/架构匹配的目标，故本工作流用矩阵把五个包分散到
# 对应 runner 上各跑一次 `package.sh`；聚合的 `release` 作业在打 tag 推送时
# （或手动 workflow_dispatch）把五个包作为 GitHub Release 附件发布。
#
# Targets / 目标：
#   windows-x64   -> windows-latest (native MinGW-w64)
#   windows-arm64 -> ubuntu-latest  (cross via gcc-mingw-w64-aarch64)
#   macos-x64     -> macos-latest   (x86_64 slice)
#   macos-arm64   -> macos-latest   (arm64 slice)
#   linux-x64     -> ubuntu-latest  (native)
#
# Verification gate / 验证门禁：
#   Before anything is published, the `verify` job builds the project and runs
#   the FULL assertion suite (lexer + parser + runtimes). If not every assertion
#   passes it RECORDS the defects and (by default) REJECTS the release. Set the
#   `allow_defects` dispatch input to true to downgrade that to a warning.
#   发布前，`verify` 作业会构建项目并运行「全部」断言套件（词法 + 语法 + 运行期）。
#   若并非全部通过，则记录缺陷并（默认）拒绝发布；在 workflow_dispatch 中把
#   allow_defects 设为 true 可降级为警告。
# ============================================================
name: Release Packages / 发布分发包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Limit to one target (e.g. windows-x64); leave empty for all.'
        required: false
        default: ''
      version:
        description: 'Release version/tag for manual dispatch (e.g. v1.31.0). Ignored on tag push.'
        required: false
        default: ''
      allow_defects:
        description: 'Publish even if not all assertions pass (defects recorded as warnings).'
        required: false
        default: 'false'

permissions:
  contents: write   # required to create a GitHub release / 创建 Release 所需

jobs:
  # ---- verification gate (runs BEFORE packaging is published) -------------
  verify:
    name: verify all assertions / 验证全部断言
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain / 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          g++ --version

      - name: Build + run full assertion suite / 构建并跑全部断言
        run: bash .github/scripts/run_asserts.sh

      - name: Upload verification report / 上传验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: build/verify-artifacts
          if-no-files-found: warn

      - name: Gate — reject on defects unless allowed / 门禁：有缺陷则拒绝（除非允许）
        run: |
          cd "$GITHUB_WORKSPACE"
          if ! grep -q '"all_passed": 1' build/verify-artifacts/assert-report.json 2>/dev/null; then
            if [ "${{ github.event.inputs.allow_defects || 'false' }}" = "true" ]; then
              echo "::warning::defects recorded but allow_defects=true — publishing despite failures"
            else
              echo "::error::release REJECTED: not all assertions passed"
              cat build/verify-artifacts/assert-report.md
              exit 1
            fi
          fi
          echo "Verification gate passed."

  package:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # windows-arm64 is a best-effort cross-build; do not fail the whole run.
    # windows-arm64 为尽力而为的交叉构建，不阻断整体流程。
    continue-on-error: ${{ matrix.continue-on-error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            setup: msys2-mingw64
          - target: windows-arm64
            os: ubuntu-latest
            cross: mingw-aarch64
            continue-on-error: true
          - target: macos-x64
            os: macos-latest
          - target: macos-arm64
            os: macos-latest
          - target: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Windows x64: native MinGW-w64 (gives a self-contained exe + DLLs) -
      - name: Set up MSYS2 (MinGW-w64 x64) / 配置 MSYS2（MinGW-w64 x64）
        if: matrix.setup == 'msys2-mingw64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake

      # --- Windows ARM64 cross toolchain on Linux --------------------------
      - name: Install aarch64-w64-mingw32 cross toolchain / 安装 aarch64 交叉工具链
        if: matrix.cross == 'mingw-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-aarch64

      # --- Build & package / 构建并打包 -------------------------------------
      - name: Run package.sh / 执行 package.sh
        shell: ${{ matrix.setup == 'msys2-mingw64' && 'msys2 {0}' || 'bash' }}
        env:
          PACKAGE_TARGETS: ${{ matrix.target }}
          # Force-build even though the host OS differs (cross scenario).
          # 跨平台场景下强制构建（宿主系统与目标不符时）。
          SYNTH_FORCE_BUILD: '1'
        run: bash package.sh

      - name: Upload artifact / 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synth-${{ matrix.target }}
          path: build/dist/synth-${{ matrix.target }}
          if-no-files-found: warn

  # The VS Code syntax-highlighting extension: built offline with the Python
  # standard library only, and attached to the release next to the five
  # interpreter packages.
  # VS Code 语法高亮插件：仅用 Python 标准库离线构建，随五个解释器包一同附在
  # Release 上。
  vsix:
    name: package VS Code extension / 打包 VS Code 插件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python / 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Offline by design: no `vsce`, no npm install, no network required.
      # 离线设计：无需 vsce、无需 npm 安装、无需联网。
      - name: Build the .vsix / 构建 .vsix
        run: python vscode-synth-oop/build_vsix.py

      - name: Upload artifact / 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: synth-oop-vsix
          path: build/*.vsix
          if-no-files-found: error

  release:
    name: publish release / 发布 Release
    needs: [verify, package, vsix]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts / 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Archive packages / 打包为压缩文件
        run: |
          cd artifacts
          shopt -s nullglob
          for d in synth-*; do
            if [ -d "$d" ]; then
              echo "archiving $d ..."
              zip -r "../$d.zip" "$d"
            fi
          done
          cd ..
          # Collect the VS Code extension produced by the `vsix` job.
          # 收集由 `vsix` 作业产出的 VS Code 插件。
          mkdir -p assets
          cp -f artifacts/synth-oop-vsix/*.vsix assets/ 2>/dev/null \
            || echo "no .vsix artifact found"
          ls -la *.zip assets/

      - name: Compute changelog / 计算变更日志
        run: |
          {
            echo "CHANGELOG<<EOF"
            git log --no-merges --oneline -30 | sed 's/^/- /'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Generate release notes / 生成 Release 说明
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          ART_DIR: artifacts/verify-report
          ASSETS_DIR: .
          OUT: release-notes.md
        run: bash .github/scripts/gen_release_notes.sh

      - name: Create GitHub release / 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # For a tag push this resolves to the tag name automatically; for a
          # manual dispatch it uses the `version` input.
          # 打 tag 推送时自动取对应 tag 名；手动调度时取 `version` 输入。
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: Synth-OOP ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          body_path: release-notes.md
          files: |
            *.zip
            assets/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
